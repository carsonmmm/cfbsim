<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football Empire</title>
<meta name="description" content="Football Empire: run any of the 138 FBS programs as athletic director, or create a player and go from high school recruit to the NFL Draft and an NFL career.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#0A1424">
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0A1424; --surface:#101D33; --surface-2:#16263F; --line:#223857; --line-2:#2D4870;
  --text:#E8EDF6; --muted:#8C9EBD; --dim:#566A8C;
  --maize:#F5C518; --maize-ink:#0A1424; --accent:#F5C518;
  --band:#06101E; --band-text:#F2F5FA; --band-muted:#8FA3C4; --band-line:#1B2D4A;
  --good:#46C281; --bad:#F0605A; --warn:#E7AB3C;
  --good-bg:rgba(70,194,129,.14); --bad-bg:rgba(240,96,90,.14); --warn-bg:rgba(231,171,60,.15); --maize-bg:rgba(245,197,24,.14);
  --me:rgba(245,197,24,.09);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --disp:"Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-mode="light"]{
  color-scheme: light;
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#E6ECF5; --line:#CFD9E7; --line-2:#B7C6DB;
  --text:#0C1B33; --muted:#52647F; --dim:#98A7BE;
  --maize:#FFCB05; --maize-ink:#00274C; --accent:#00274C;
  --band:#00274C; --band-text:#F4F7FB; --band-muted:#A9BBD6; --band-line:#1A3E66;
  --good:#177A48; --bad:#C23129; --warn:#9A6200;
  --good-bg:rgba(23,122,72,.1); --bad-bg:rgba(194,49,41,.09); --warn-bg:rgba(154,98,0,.1); --maize-bg:rgba(255,203,5,.28);
  --me:rgba(255,203,5,.16);
  --shadow:0 12px 30px rgba(12,27,51,.18);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
select,textarea{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:6px}
select{padding:7px 10px}
:focus-visible{outline:2px solid var(--maize);outline-offset:2px}
.num,td.num,.tiles .v,.board .v{font-variant-numeric:tabular-nums}

/* header */
#hdr{background:var(--band);color:var(--band-text);padding:16px max(16px,calc((100% - 1240px)/2));display:grid;grid-template-columns:auto 1fr auto;gap:18px 28px;align-items:center;border-bottom:3px solid var(--on-band,var(--maize))}
.brand .wm{font-family:var(--disp);font-weight:900;font-size:40px;line-height:.9;letter-spacing:.02em;color:var(--on-band,var(--maize))}
.brand .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted);margin-top:4px}
.board{display:flex;flex-wrap:wrap;gap:0;justify-self:start}
.board .cell{display:flex;flex-direction:column;padding:2px 16px;border-left:1px solid var(--band-line);min-width:0}
.board .cell:first-child{border-left:0}
.board .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted)}
.board .v{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.05}
.board .v.sm{font-size:18px;line-height:1.5}
.board .s{font-size:11px;color:var(--band-muted)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.btn{border:1px solid var(--line-2);background:var(--surface-2);padding:9px 14px;border-radius:6px;cursor:pointer;font-weight:600;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--maize)}
.btn.primary{background:var(--maize);color:var(--maize-ink);border-color:var(--maize);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
#hdr .btn.ghost{color:var(--band-text);border-color:var(--band-line)}
#hdr .btn.primary{background:var(--hdr-btn,var(--maize));border-color:var(--hdr-btn,var(--maize));color:var(--hdr-ink,var(--maize-ink))}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled,.tog:disabled,.icon:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line-2)}

/* tabs */
#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 max(10px,calc((100% - 1240px)/2));scrollbar-width:thin}
.tab{border:0;background:none;padding:12px 12px 10px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--maize)}
.tab.hot{color:var(--accent)}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2 .col{display:flex;flex-direction:column;gap:16px;min-width:0}
.depthg{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 20px;margin-bottom:10px}
.head .hint{max-width:52ch;margin:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.h2{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.05;margin:0 0 6px;letter-spacing:.01em;text-wrap:balance}
.h3{font-family:var(--disp);font-weight:700;font-size:22px;margin:0 0 4px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;max-width:70ch}
.mt{margin-top:16px}
.row{display:flex;flex-wrap:wrap;align-items:center}
.gap{gap:8px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.up{color:var(--good);font-weight:600;font-size:12px} .dn{color:var(--bad);font-weight:600;font-size:12px}
.flash{background:var(--maize-bg);border:1px solid var(--maize);border-radius:6px;padding:8px 12px;font-weight:600}

/* team chip */
.team{display:inline-flex;align-items:baseline;gap:6px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.team:hover .tn{text-decoration:underline;text-underline-offset:3px}
.team.fcs{cursor:default}
.team .rk{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.team .tn{font-weight:600}
.team .tn.me{color:var(--accent)}
.team .rec{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lnk{background:none;border:0;padding:0;cursor:pointer;color:var(--text);font-weight:600;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;text-align:left}
.lnk:hover{text-decoration-color:var(--maize)}
.res-w b,b.res-w{color:var(--good)} .res-l b,b.res-l{color:var(--bad)}

/* pills */
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;vertical-align:middle}
.pill.maize{background:var(--maize-bg);color:var(--accent)}
.pill.ghost{background:transparent;border:1px solid var(--line-2)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.ovr{display:inline-block;min-width:32px;text-align:center;font-family:var(--disp);font-weight:700;font-size:16px;padding:0 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.o-elite{background:var(--maize);color:var(--maize-ink)} .o-good{background:var(--good-bg);color:var(--good)} .o-avg{background:var(--surface-2)} .o-low{color:var(--muted)}

/* next game */
.next .matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:8px 0 4px}
.next .matchup .side{font-family:var(--disp);font-size:28px;font-weight:800;line-height:1.1;min-width:0}
.next .matchup .side:last-child{text-align:right}
.next .matchup .team .tn{font-weight:800}
.next .matchup .team .rk{font-size:15px;font-family:var(--body)}
.next .matchup .team .rec{font-family:var(--body);font-size:13px}
.next .at{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.venue{color:var(--muted);font-size:13px;margin-bottom:12px}
.wp{margin:10px 0 14px}
.wpbar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.wpbar i{display:block;height:100%;background:var(--maize)}
.wpl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:5px}
.wpl b{color:var(--text)}
.final{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.final .res{font-family:var(--disp);font-weight:900;font-size:30px;width:40px;height:40px;display:grid;place-items:center;border-radius:6px}
.final .res.w{background:var(--good-bg);color:var(--good)} .final .res.l{background:var(--bad-bg);color:var(--bad)}
.final .sc{font-family:var(--disp);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}

/* meters */
.meter{margin:10px 0 14px}
.mrow{display:flex;justify-content:space-between;align-items:baseline}
.meter .lbl{font-weight:600}
.mval{font-family:var(--disp);font-weight:800;font-size:22px}
.mval.good{color:var(--good)} .mval.warn{color:var(--warn)} .mval.bad{color:var(--bad)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%} .bar i.good{background:var(--good)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.meter .hint{margin-top:4px}

.news,.goals,.plays{list-style:none;margin:0;padding:0}
.news li{padding:8px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:78px 1fr;gap:10px}
.news li:first-child{border-top:0}
.news li .when{font-size:11px;color:var(--muted);letter-spacing:.04em;padding-top:2px}
.news li.win{} .news li.loss{} .news li.big{font-weight:600}
.news li.bad .when{color:var(--bad)}
.goals li{display:flex;gap:10px;align-items:baseline;padding:6px 0}
.gs{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;width:92px;text-align:center;padding:2px 0;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.gs.met{background:var(--good-bg);color:var(--good)} .gs.failed{background:var(--bad-bg);color:var(--bad)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px} /* tiles wrap rather than squeeze their numbers when the column is narrow */
.tiles>div{background:var(--surface-2);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.tiles .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tiles .v{font-family:var(--disp);font-weight:800;font-size:28px;line-height:1.1}
.tiles .v.sm{font-size:19px;line-height:1.5}
.tiles .s{font-size:12px;color:var(--muted)}
.tiles.big>div{background:var(--surface);border:1px solid var(--line)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.me{background:var(--me)}
.tbl tr.kept td{background:var(--good-bg)}
.tbl tr.out td{opacity:.55}
.tbl tr.bye td{color:var(--muted);font-style:italic}
.tbl tr.cur{box-shadow:inset 3px 0 0 var(--maize)}
.tbl .site{color:var(--muted);font-size:12px}
.tbl .nowrap{white-space:nowrap}
.tbl.poll .rk2{font-family:var(--disp);font-weight:800;font-size:18px;width:40px}
.sort{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.sort.on{color:var(--accent)}
table.mini{border-collapse:collapse;margin:6px 0 12px;font-size:13px}
table.mini th,table.mini td{padding:4px 12px 4px 0;text-align:left}
table.mini th{font-size:11px;color:var(--muted);letter-spacing:.08em}
table.mini.wide{width:100%}
table.mini.wide td{border-bottom:1px solid var(--line);padding:6px 8px 6px 0}
.stars{color:var(--maize);letter-spacing:1px;white-space:nowrap}
[data-mode="light"] .stars{color:#C99700}

/* chips & segmented */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.chip span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.chip.on{background:var(--maize);border-color:var(--maize);color:var(--maize-ink)}
.chip.on span{color:var(--maize-ink);opacity:.75}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 11px;cursor:pointer;font-weight:600;font-size:12.5px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--maize);color:var(--maize-ink)}
.tog{border:1px solid var(--line-2);background:transparent;border-radius:5px;padding:4px 9px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.tog.on{background:var(--maize);border-color:var(--maize);color:var(--maize-ink)}

/* depth chart */
.depth{list-style:none;margin:0;padding:0}
.depth li{display:grid;grid-template-columns:26px 68px minmax(0,1fr) auto 38px auto;gap:8px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line)}
.depth li.st{background:var(--me)}
.depth li.inj .nm{text-decoration:line-through;color:var(--muted)}
.depth .ord{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.depth .slot{display:block;border:0;padding:0;border-radius:0;min-width:0;white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)} /* not the save-slot card (CL-23) */
.depth li.st .slot{color:var(--accent)}
.depth li.inj .slot{color:var(--bad)}
.depth .cls{font-size:12px;white-space:nowrap}
.depth .mv{display:flex;gap:4px}
.icon{border:1px solid var(--line-2);background:transparent;border-radius:5px;width:28px;height:28px;cursor:pointer;font-size:11px;line-height:1;display:inline-grid;place-items:center}
.icon.txt{width:auto;padding:0 8px;font-weight:600}
.icon:hover:not(:disabled){border-color:var(--maize)}

/* staff */
.coachgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.coachgrid.top{grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr))}
.coach{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.coach.big{background:var(--surface-2)}
.coach.big .cname{font-size:30px}
.coach.vacant{border-style:dashed}
.coach .role{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.coach .cname{font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.05}
.coach .rt{display:flex;flex-wrap:wrap;gap:4px 12px}
.coach .rt span{font-family:var(--disp);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.coach .rt em{font-style:normal;font-family:var(--body);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-right:4px;font-weight:600}
.coach .contract{font-size:12px;color:var(--muted)}
.cands{margin-top:12px}
.cand{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:10px 0;border-top:1px solid var(--line)}
.cand.out{opacity:.55}

/* scores */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.game{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface)}
.game.me{border-color:var(--maize);background:var(--me)}
.gname{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.gl{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.gl .gsc,.bl .gsc{font-family:var(--disp);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.gl.lose{opacity:.6}
.gl.win .tn{font-weight:700}
.gfoot{font-size:11.5px;color:var(--muted);margin-top:3px}

/* bracket */
.bracket-wrap{overflow-x:auto;margin-top:8px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:14px;min-width:880px}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.rh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bg{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface-2)}
.bg.empty{color:var(--muted);text-align:center;padding:16px}
.bl{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:6px;padding:2px 0}
.bl.lose{opacity:.55}
.bl.me .tn{color:var(--accent)}
.seed{font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.byes{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px}
.byes .eyebrow{grid-column:1/-1;margin:0}
.proj{columns:2;column-gap:28px;padding-left:22px;margin:10px 0 0}
.proj li{padding:3px 0}

/* finances */
.stepper{padding:12px 0;border-top:1px solid var(--line)}
.stepper:first-of-type{border-top:0}
.stepper .lbl{font-weight:600;margin-bottom:6px}
.stepper .ctl{display:inline-flex;align-items:center;gap:10px}
.stepper .val{font-family:var(--disp);font-weight:800;font-size:22px;min-width:140px;text-align:center;font-variant-numeric:tabular-nums}
.tbl.fin td:first-child{width:60%}

/* facilities */
.facgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pips{display:flex;align-items:center;gap:5px;margin:8px 0 12px}
.pips i{width:26px;height:8px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line-2)}
.pips i.on{background:var(--maize);border-color:var(--maize)}
.pips i.bld{background:repeating-linear-gradient(45deg,var(--maize) 0 4px,transparent 4px 8px);border-color:var(--maize)}
.pips span{margin-left:8px;font-size:12.5px;color:var(--muted)}

/* offseason */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px}
.steps li{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.steps li span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-size:12px}
.steps li.on{color:var(--text)} .steps li.on span{background:var(--maize);border-color:var(--maize);color:var(--maize-ink)}
.steps li.done span{background:var(--good-bg);color:var(--good);border-color:transparent}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(3,8,16,.62);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
#modal[hidden]{display:none!important}
.mbox{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);width:100%;max-width:820px;padding:22px;position:relative}
.mclose{position:absolute;top:12px;right:12px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.bsh .tbl.line td,.bsh .tbl.line th{text-align:center}

/* ================= v5: themes, settings, navigation, phone layout, motion ================= */

.fx .wpbar i,.fx .bar i{transition:width .5s ease}
.fx .tdflash{animation:tdpop 1.1s ease-out both}
.fx .live b.pop{animation:scorepop .6s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
@keyframes fadein{from{opacity:0}}
@keyframes marquee{to{transform:translateX(-50%)}}
.fx #view.enter>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.fx #view.enter>*:nth-child(2){animation-delay:.05s}
.fx #view.enter>*:nth-child(3){animation-delay:.1s}
.fx #view.enter>*:nth-child(4){animation-delay:.15s}
.fx #view.enter>*:nth-child(n+5){animation-delay:.2s}
.fx #view.enter .bar i,.fx #view.enter .wpbar i{animation:grow .9s .12s cubic-bezier(.2,.7,.2,1) both;transform-origin:left center}
.fx #modal:not([hidden]){animation:fadein .18s ease-out both}
.fx #modal:not([hidden]) .mbox{animation:pop .24s cubic-bezier(.2,.7,.2,1) both}
.fx .flash{animation:rise .35s cubic-bezier(.2,.7,.2,1) both}

.fx :is(.btn,.tab,.chip,.seg button,.evopt,.skincard,.tbtn,.morebtn,#mnav button){transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,translate .1s}
.fx :is(.btn,.evopt,.skincard,.morebtn):active{translate:0 1px}
.fx body{transition:background-color .25s,color .25s}

.live .lhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;padding-right:76px}
.live .lhead .eyebrow{margin:0}
.bug{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;margin:10px 0;background:var(--band);color:var(--band-text);border-radius:10px;overflow:hidden}
.bug .bt{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;padding:12px 18px}
.bug .bt .bn{font-weight:700;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bug .bt .bn em{font-style:normal;font-size:12px;font-weight:700;opacity:.7;margin-right:6px}
.bug .bt .brec{grid-row:2;font-size:12px;color:var(--band-muted)}
.bug .bt .bs{grid-row:1/3;grid-column:2;font-family:var(--disp);font-size:54px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.bug .bt:last-child{grid-template-columns:auto minmax(0,1fr);text-align:right}
.bug .bt:last-child .bs{grid-column:1}.bug .bt:last-child .bn,.bug .bt:last-child .brec{grid-column:2}
.bug .bt.me .bn{color:var(--on-band,var(--maize))}
.bug .ball{display:inline-block;width:15px;height:9px;border-radius:50%;background:#8a4b22;margin-left:8px;vertical-align:1px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.bug .bclock{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:8px 18px;min-width:104px;background:rgba(0,0,0,.22)}
.bug .bclock b{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1}
.bug .bclock span{font-size:12px;color:var(--band-muted);font-variant-numeric:tabular-nums}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:stretch;margin-bottom:6px}
.lscore{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;align-self:center}
.lscore th,.lscore td{padding:4px 9px;text-align:center;border-bottom:1px solid var(--line)}
.lscore thead th{font-size:11px;color:var(--muted);font-weight:600}
.lscore th[scope=row]{text-align:left;font-weight:700}
.lscore .tot{font-weight:800}
.lscore tr.me th{color:var(--accent)}
.lastplay{display:flex;flex-direction:column;justify-content:center;gap:3px;border-left:4px solid var(--line-2);padding:8px 14px;background:var(--surface-2);border-radius:0 8px 8px 0;min-width:0}
.lastplay .lpk{font-family:var(--disp);font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.lastplay .lpt{font-size:13.5px}
.lastplay.big{border-left-color:var(--maize)}
.lastplay.big .lpk{color:var(--accent);font-size:26px}
@media (max-width:640px){.lrow{grid-template-columns:1fr}.bug .bt{padding:10px 12px}.bug .bt .bs{font-size:40px}.bug .bt .bn{font-size:14px}.bug .bclock{min-width:74px;padding:6px 8px}.live .lhead{padding-right:64px}}

/* phone layout */
@media (max-width:720px){
  #tabs{display:none!important}
  #mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:14;background:var(--surface);border-top:1px solid var(--line-2);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.14)}

  #mnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #mnav button.on{color:var(--accent);background:var(--maize-bg)}
  #mnav svg{width:22px;height:22px}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  #hdr{position:relative;padding:12px 14px 14px;gap:10px}
  .brand .sub{font-size:10px;padding-right:96px}
  .tools{position:absolute;top:8px;right:8px;margin:0}
  .tools .tbtn span{display:none}
  .tools .tbtn{padding:8px;min-width:40px;min-height:40px;justify-content:center}
  .board{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}

  .board .cell{flex:none}
  .acts .row .btn{flex:1 1 auto}
  .btn{min-height:44px}.btn.sm{min-height:38px}

  .tog,.chip{min-height:34px}
  .seg button{min-height:40px}
  main{padding-inline:12px;padding-top:12px;gap:12px}
  .card{padding:14px}
  #modal{padding:0;align-items:flex-end}
  .mbox{max-width:none;border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .simmenu .menu{right:auto;left:0;min-width:0;width:calc(100vw - 28px)}
  .setrow{grid-template-columns:1fr}

}

/* news ticker (Broadcast theme) */
#ticker .tag{flex:none;height:100%;display:flex;align-items:center;padding:0 30px 0 18px;background:#06152b;color:#ffcb05;clip-path:polygon(0 0,100% 0,86% 100%,0 100%);white-space:nowrap}

.mode::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--maize)}
.mode p{margin:0}
.mode .h2{font-size:34px;margin:0}
.mglyph{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--maize-bg);color:var(--accent)}
.mglyph svg{width:28px;height:28px}
.msave{border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.mode .btn{align-self:flex-start}
.stars .dimstar{opacity:.22}
.stars.big{font-size:24px;letter-spacing:2px}
.grade{display:inline-grid;place-items:center;min-width:54px;height:54px;padding:0 8px;border-radius:10px;font-family:var(--disp);font-weight:900;font-size:32px;line-height:1;background:var(--surface-2);color:var(--text);flex:none}
.grade.sm{min-width:30px;height:24px;font-size:15px;border-radius:5px;padding:0 5px}
.grade.good{background:var(--good-bg);color:var(--good)} .grade.maize{background:var(--maize-bg);color:var(--accent)} .grade.bad{background:var(--bad-bg);color:var(--bad)}
.sline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.sline b{color:var(--text);font-family:var(--disp);font-size:18px;font-weight:800;margin-right:2px}
.gsrow{display:flex;gap:14px;align-items:flex-start;margin:8px 0}
.gsum{border:2px solid var(--maize);border-radius:8px;padding:14px;margin:10px 0;background:var(--surface-2)}
.myline{margin:8px 0 2px}
.look{margin:6px 0 2px;padding:8px 10px;border-left:3px solid var(--maize);background:var(--surface)}
.livelog li.mine{background:var(--me)}
.livelog .you{color:var(--accent);font-weight:600}
.pch{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.jn{font-family:var(--disp);font-weight:900;font-size:38px;line-height:1;min-width:58px;height:58px;display:grid;place-items:center;border-radius:10px;background:var(--band);color:var(--band-text);border-bottom:3px solid var(--maize)}
.attrs{list-style:none;margin:10px 0 0;padding:0}
.attrs li{display:grid;grid-template-columns:minmax(0,1.3fr) 34px minmax(60px,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.attrs .an{font-weight:600}
.attrs .av{font-family:var(--disp);font-weight:800;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.attrs .bar{margin:0}
[data-app=career] .steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:4px 0 14px;padding:0;counter-reset:st}
[data-app=career] .steps li{counter-increment:st;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
[data-app=career] .steps li::before{content:counter(st) ". "}
[data-app=career] .steps li.done{background:var(--good-bg);border-color:transparent;color:var(--good)}
[data-app=career] .steps li.cur{background:var(--maize);border-color:var(--maize);color:var(--maize-ink)}
.ib{display:flex;align-items:center;gap:6px;min-width:90px}
.ib .bar{flex:1;margin:0}
.tbl.rec td{vertical-align:top}
.tbl.rec .row.gap{gap:4px;flex-wrap:nowrap}
.cdepth{list-style:none;margin:0;padding:0}
.cdepth li{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.cdepth li.st{box-shadow:inset 3px 0 0 var(--good)}
.cdepth li.me{background:var(--me)}
.cdepth .ord{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.cdepth .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.posgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.posgrid .evopt b{font-family:var(--disp);font-size:20px}
.fld.inl{flex-direction:row;align-items:center;gap:6px;margin-left:auto}
.fld.inl select{width:auto}
.donec .h2{font-size:38px}
p.big{font-size:18px}
.newcareer{border-width:2px}
.num.pos{color:var(--good)} .num.neg,.neg{color:var(--bad)}
.offc .tiles{margin:6px 0}
@media (max-width:900px){.modes{grid-template-columns:1fr}.homehero .h2{font-size:34px}}
@media (max-width:720px){

  .attrs li{grid-template-columns:minmax(0,1fr) 30px auto;row-gap:4px}
  .attrs li .bar{grid-column:1/-1;grid-row:2}
  .mode{padding:16px}
  .fld.inl{margin-left:0}
  .gsrow{flex-direction:row}
}
[data-skin=gazette] .mode{border-radius:0;border:0;border-top:3px double var(--rule);background:transparent}
[data-skin=gazette] .mode::after{display:none}
[data-skin=gazette] .jn{background:transparent;color:var(--text);border:2px solid var(--text);border-radius:0}

  .tbl.rec td.vis:empty{display:none}
}

.codebox{width:100%;min-height:84px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);word-break:break-all;margin-top:8px}

// Rivals for a school: named rivalries first, then the nearest conference opponent if it has none.
function rivalsFor(id, teams, confOf) {
  const out = []; RIVALRIES.forEach(([a, b, nm]) => { if (a === id && teams[b]) out.push([b, nm]); else if (b === id && teams[a]) out.push([a, nm]); });
  if (!out.length) {
    const st = TEAM_STATE[id]; const mates = Object.keys(teams).filter(x => x !== id && confOf(x) === confOf(id));
    const near = mates.sort((x, y) => ((TEAM_STATE[y] === st) - (TEAM_STATE[x] === st)) || ((REGION_OF[TEAM_STATE[y]] === REGION_OF[st]) - (REGION_OF[TEAM_STATE[x]] === REGION_OF[st])) || x.localeCompare(y))[0];
    if (near) out.push([near, teamsName(teams, id) + '–' + teamsName(teams, near)]);
  }
  return out.slice(0, 3);
}
function teamsName(teams, id) { return teams[id] ? teams[id].name : id; }

/* ---------- save queues (shared by AD Mode and Player Career) ----------
 * A queue snapshots a game right away and remembers it as the newest pending save for its
 * slot. A short debounce batches rapid clicks. Writes run one at a time through a promise
 * chain, and each carries a sequence number, so an older snapshot can never land on top of
 * a newer one, whether it was written asynchronously (compressed) or synchronously when the
 * page was hidden. flush() writes everything pending and resolves when storage is up to date.
 * If the page is hidden or closed before an async write finishes, flushSync() writes the
 * newest snapshot uncompressed, synchronously. A failed write keeps its snapshot so the next
 * flush tries again, and failed[slot] stays set until a later write for that slot succeeds. */
function makeSaveQueue(cfg) {
  const q = { pending: {}, inflight: {}, timer: null, chain: Promise.resolve(), seq: 0, written: {}, failed: {}, retry: {} };
  const commit = job => { let m; try { m = JSON.parse(lsGet(cfg.metaKey) || '{}') || {}; } catch (e) { m = {}; } m[job.slot] = job.sum; lsSet(cfg.metaKey, JSON.stringify(m)); };
  const ok = job => { q.written[job.slot] = job.seq; delete q.failed[job.slot]; delete q.retry[job.slot]; commit(job); cfg.status(job.slot, true); };
  const bad = job => { q.failed[job.slot] = job.seq; if (!q.retry[job.slot] || q.retry[job.slot].seq < job.seq) q.retry[job.slot] = job; cfg.status(job.slot, false); };
  q.push = (slotI, json, sum) => { q.pending[slotI] = { slot: slotI, seq: ++q.seq, json, sum }; clearTimeout(q.timer); q.timer = setTimeout(q.flush, 150); };
  q.write = async job => {
    if ((q.written[job.slot] || 0) > job.seq) return;
    q.inflight[job.slot] = job;
    try {
      const data = await gz(job.json);
      if ((q.written[job.slot] || 0) > job.seq) return; // a newer snapshot already landed
      if (lsSet(cfg.key(job.slot), data)) ok(job); else bad(job);
    } finally { if (q.inflight[job.slot] === job) delete q.inflight[job.slot]; }
  };
  q.flush = () => {
    clearTimeout(q.timer); q.timer = null;
    // a snapshot that failed earlier is written again unless something newer is waiting
    Object.values(q.retry).forEach(j => { if (!q.pending[j.slot] || q.pending[j.slot].seq < j.seq) q.pending[j.slot] = j; });
    const jobs = Object.values(q.pending); q.pending = {};
    jobs.forEach(job => { q.chain = q.chain.then(() => q.write(job)).catch(e => console.error('save failed', e)); });
    return q.chain;
  };
  q.flushSync = () => {
    const latest = {};
    [...Object.values(q.inflight), ...Object.values(q.pending), ...Object.values(q.retry)].forEach(j => { if (!latest[j.slot] || j.seq > latest[j.slot].seq) latest[j.slot] = j; });
    Object.values(latest).forEach(j => {
      if ((q.written[j.slot] || 0) >= j.seq) { delete q.pending[j.slot]; return; }
      if (lsSet(cfg.key(j.slot), 'RAW:' + j.json)) { ok(j); delete q.pending[j.slot]; }
      else { q.pending[j.slot] = j; bad(j); } // kept, so the next flush tries again if the page stays open
    });
  };
  // A deleted slot retires everything queued for it, so a late write can't bring it back.
  q.retire = i => { delete q.pending[i]; delete q.retry[i]; delete q.failed[i]; q.written[i] = ++q.seq; };
  return q;
}

/* ---------- adopting a loaded or imported game ----------
 * A candidate is validated and migrated while the current game is kept aside. Only if
 * every check passes does it become the active game; otherwise the previous game, its
 * player index, conference lists and random position are restored untouched. */
function checkShape(s) {

  if (!s.teams || typeof s.teams !== 'object' || !s.teams[s.my || 'MICH']) throw new Error('No program data was found.');
  if (Object.keys(s.teams).length < 100) throw new Error('The league data is incomplete.');
  if (!Array.isArray(s.roster) || !s.roster.length) throw new Error('The roster is missing.');
  if (!Array.isArray(s.games) || !s.fin || typeof s.fin !== 'object' || !s.meters || !s.depth || !s.staff || !Number.isFinite(+s.season)) throw new Error('Required game data is missing.');
}

  s.roster.forEach(p => { if (!p || !p.id || !POS_ORDER.includes(p.pos) || !Number.isFinite(p.ovr)) throw new Error('A player record is damaged.'); });
  Object.values(s.teams).forEach(t => { if (!CONFS[t.conf] || !Number.isFinite(t.rating)) throw new Error('A team record is damaged.'); });

/* ---------- save codes ---------- */
// A code is the save as text: PREFIX1: gzip + base64, or PREFIX0: plain base64 as a fallback.
async function encodeCode(json, prefix) {
  try { if (window.CompressionStream) { const st = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip')); const buf = new Uint8Array(await new Response(st).arrayBuffer()); let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); return prefix + '1:' + btoa(bin); } } catch (e) { }

}
async function decodeCode(code, prefix) {
  code = (code || '').trim(); const n = prefix.length + 2;
  try {
    if (code.startsWith(prefix + '1:')) { const bin = atob(code.slice(n)); const buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i); const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')); return JSON.parse(await new Response(ds).text()); }
    if (code.startsWith(prefix + '0:')) return JSON.parse(decodeURIComponent(escape(atob(code.slice(n)))));
  } catch (e) { throw new Error('The code is incomplete or damaged.'); }
  throw new Error(`Save codes for this mode start with ${prefix}.`);
}

  if (cs.liveWk != null && cs.liveWk === cs.week && cInSeason()) { if (cs.liveRng) RNG.s = cs.liveRng >>> 0; const g = cStartGame(); if (g) { cgAutoplay(g); const rec = cFinishGame(g); cEndWeek(); cs.settled = rec; } }
  cs.liveWk = null;
}
let cValidateView = null; // set by the interface: renders every career screen as a final check
// Adopt a candidate career only if every check passes; otherwise put everything back.
function cAdopt(c) {
  const prev = { cs, rng: RNG.s, cg };
  try {
    cValidate(c); cMigrate(c);
    cs = c; cg = null; rosterCache.clear(); RNG.s = (c.rng >>> 0) || freshSeed();
    cSettle();
    if (cValidateView) cValidateView();
    return true;
  } catch (e) { cs = prev.cs; cg = prev.cg; RNG.s = prev.rng; rosterCache.clear(); throw e; }
}
async function cLoadSlot(i) {
  const raw = lsGet(CSLOT_KEY(i)); if (!raw) return { ok: false, err: 'That slot is empty.' };
  let c; try { c = JSON.parse(await gunz(raw)); } catch (e) { return { ok: false, err: `Slot ${i} could not be read: the saved data is damaged or incomplete.` }; }
  try { cAdopt(c); cslot = i; lsSet(CACTIVE_KEY, String(i)); return { ok: true }; }
  catch (e) { console.error(e); return { ok: false, err: `Slot ${i} could not be loaded: ${e && e.message ? e.message : 'the save could not be read.'}` }; }
}
async function cDeleteSlot(i) { await cFlush(); CQ().retire(i); lsDel(CSLOT_KEY(i)); const m = cMeta(); delete m[i]; lsSet(CMETA_KEY, JSON.stringify(m)); }

// "Impact points" turn a stat line into one number per position, used for grades and awards.
function impactPts(st, pos) {
  const g = k => st[k] || 0;
  switch (pos) {
    case 'QB': return g('pyd') / 25 + g('ptd') * 4 - g('int') * 4 + g('ryd') / 10 + g('rtd') * 6 - g('fum') * 3 + (g('att') >= 8 ? (g('cmp') / g('att') - 0.6) * 12 : 0);
    case 'RB': return g('ryd') / 10 + g('rtd') * 6 + g('recyd') / 10 + g('rec') * 0.5 + g('rectd') * 6 - g('fum') * 4;
    case 'WR': return g('recyd') / 10 + g('rectd') * 6 + g('rec') * 0.5;
    case 'TE': return g('recyd') / 10 + g('rectd') * 6 + g('rec') * 0.5 + g('pan') * 0.8;
    case 'CB': return g('tkl') + g('pbu') * 3 + g('dint') * 8 + g('tfl') * 2 + g('dtd') * 6 + g('ff') * 5;
    case 'S': return g('tkl') + g('pbu') * 3 + g('dint') * 8 + g('tfl') * 2 + g('ff') * 5 + g('dtd') * 6;
    case 'DE': return g('tkl') + g('tfl') * 2 + g('sack') * 5 + g('ff') * 5 + g('hur') + g('dtd') * 6;
    case 'LB': return g('tkl') + g('tfl') * 2 + g('sack') * 4 + g('dint') * 8 + g('pbu') * 2 + g('ff') * 5 + g('dtd') * 6;
  }
  return 0;
}

/* ---------- charts (single series, accent ink, hover tooltips) ---------- */
function lineChart(pts, o) {
  // pts: [{y, lbl, tip}] ; o: {min,max,invert,ref,refLbl,h,yTicks,fmt}
  const W = 640, H = o.h || 200, L = 40, Rr = 12, Tp = 12, B = 26;
  const n = pts.length; if (n < 2) return `<p class="hint">${o.empty || 'Not enough data yet.'}</p>`;
  const xs = i => L + (W - L - Rr) * (n === 1 ? 0.5 : i / (n - 1));
  const ys = v => { const t = (v - o.min) / (o.max - o.min); return Tp + (H - Tp - B) * (o.invert ? t : 1 - t); };
  const grid = (o.yTicks || []).map(v => `<line x1="${L}" x2="${W - Rr}" y1="${ys(v)}" y2="${ys(v)}" class="cg"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end" class="ct">${o.fmt ? o.fmt(v) : v}</text>`).join('');
  const ref = o.ref != null ? `<line x1="${L}" x2="${W - Rr}" y1="${ys(o.ref)}" y2="${ys(o.ref)}" class="cref"/>${o.refLbl ? `<text x="${W - Rr}" y="${ys(o.ref) - 5}" text-anchor="end" class="ct">${o.refLbl}</text>` : ''}` : '';
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(p.y).toFixed(1)}`).join(' ');
  const area = o.area ? `<path d="${d} L${xs(n - 1)},${ys(o.area)} L${xs(0)},${ys(o.area)} Z" class="carea"/>` : '';
  const xl = (o.xLabels || []).map(([i, t]) => `<text x="${xs(i)}" y="${H - 8}" text-anchor="middle" class="ct">${esc(t)}</text>`).join('');
  const marks = pts.map((p, i) => (o.dots !== false || i === n - 1) ? `<circle cx="${xs(i)}" cy="${ys(p.y)}" r="${i === n - 1 ? 5 : 4}" class="cdot"/>` : '').join('');
  const bw = (W - L - Rr) / Math.max(1, n - 1);
  const hits = pts.map((p, i) => `<rect x="${xs(i) - bw / 2}" y="0" width="${bw}" height="${H}" class="chit" data-tip="${esc(p.tip || p.lbl + ': ' + p.y)}"/>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || 'Chart')}">${grid}${ref}${area}<path d="${d}" class="cline"/>${marks}${xl}${hits}</svg></div>`;
}
function barChart(items, o) {
  const W = 640, H = o.h || 180, L = 44, Rr = 10, Tp = 14, B = 26; const n = items.length; if (!n) return `<p class="hint">${o.empty || 'No data yet.'}</p>`;
  const vals = items.map(x => x.v); const max = Math.max(o.min0 ? 0 : -Infinity, ...vals, 1e-9), min = Math.min(0, ...vals);
  const hi = max === min ? max + 1 : max; const ys = v => Tp + (H - Tp - B) * (1 - (v - min) / (hi - min));
  const bwid = Math.min(46, (W - L - Rr) / n * 0.62); const xc = i => L + (W - L - Rr) * ((i + 0.5) / n);
  const ticks = o.ticks || [min, (min + hi) / 2, hi].map(v => Math.round(v * 10) / 10);
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${ys(v)}" y2="${ys(v)}" class="cg"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end" class="ct">${o.fmt ? o.fmt(v) : v}</text>`).join('');
  const bars = items.map((x, i) => { const y0 = ys(0), y1 = ys(x.v); const top = Math.min(y0, y1), h = Math.max(1.5, Math.abs(y1 - y0)); return `<rect x="${xc(i) - bwid / 2}" y="${top}" width="${bwid}" height="${h}" rx="3" class="cbar${x.v < 0 ? ' neg' : ''}"/><text x="${xc(i)}" y="${H - 8}" text-anchor="middle" class="ct">${esc(x.lbl)}</text><rect x="${xc(i) - (W - L) / n / 2}" y="0" width="${(W - L) / n}" height="${H}" class="chit" data-tip="${esc(x.tip || x.lbl + ': ' + x.v)}"/>`; }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || 'Chart')}">${grid}<line x1="${L}" x2="${W - Rr}" y1="${ys(0)}" y2="${ys(0)}" class="cbase"/>${bars}</svg></div>`;
}

/* ---------- schedule ---------- */
function vSchedule() {
  const games = mGames(); let w = 0, l = 0; const rows = [];
  for (let wk = 1; wk <= 18; wk++) {
    const g = games.find(x => x.wk === wk);
    if (!g) { if (wk <= 13) rows.push(`<tr class="bye"><td>${wk}</td><td>${weekDate(state.season, wk)}</td><td colspan="4" class="muted">Open week</td></tr>`); continue; }
    const opp = oppOf(g); let res = '<span class="muted">—</span>', recs = '';
    if (g.done) { const a = g.h === ME ? g.hs : g.as, b = g.h === ME ? g.as : g.hs; if (a > b) w++; else l++; res = `<button class="lnk res-${a > b ? 'w' : 'l'}" data-act="box" data-id="${g.id}"><b>${a > b ? 'W' : 'L'}</b> ${a}–${b}${g.ot ? ' OT' : ''}</button>`; recs = `${w}-${l}`; }
    else if (!isFCS(opp)) res = `<span class="muted">${Math.round(mWinProb(g) * 100)}% win</span>`;
    const tag = rivalOf(opp) ? `<span class="pill maize">${esc(rivalOf(opp))}</span>` : g.type !== 'reg' ? `<span class="pill">${esc(g.name)}</span>` : g.loc ? `<span class="pill ghost">${esc(g.loc.split(' (')[0])}</span>` : (T(opp) && T(ME) && T(opp).conf === T(ME).conf && T(ME).conf !== 'IND' ? `<span class="pill ghost">${esc(confShort(T(ME).conf))}</span>` : '');
    rows.push(`<tr class="${g.done ? '' : 'up'}${state.week === wk && state.phase !== 'offseason' ? ' cur' : ''}"><td>${wk <= 13 ? wk : '—'}</td><td>${wk <= 13 ? weekDate(state.season, wk) : esc(weekLabel(wk).split(' · ').pop())}</td><td class="site">${siteOf(g)}</td><td>${tchip(opp, { rec: true })} ${tag}</td><td>${res}</td><td class="num">${recs}</td></tr>`);
  }
  return `<section class="card"><div class="head"><div><div class="eyebrow">${state.season} schedule</div><h2 class="h2">${esc(teamName(ME))} ${T(ME).w}-${T(ME).l}</h2></div><p class="hint">${state.season === 2026 && isRealMich() ? 'This is the real 2026 schedule. ' : ''}Tap a result for the box score.</p></div>
  <div class="tw"><table class="tbl sched"><thead><tr><th>Wk</th><th>Date</th><th></th><th>Opponent</th><th>Result</th><th>Rec</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></section>
  ${[state.season + 1, state.season + 2].map(futureSched).join('')}`;
}

   <div class="stepper"><div class="lbl">NIL collective fundraising drive</div>${f.drive ? '<div class="hint">Done this season.</div>' : '<button class="btn sm" data-act="drive">Launch drive</button><div class="hint">Raises $3–7M for the player pay pool this year. Costs some booster goodwill. Once per season.</div>'}</div>

function vPayroll() {

function vFac() {

/* ---------- history ---------- */

  return `<section class="card"><div class="head"><div><div class="eyebrow">Legacy</div><h2 class="h2">Legacy score ${legacyScore()}</h2></div><p class="hint">Titles, wins, archrival wins, profits, draft picks, Heismans and achievements, multiplied by difficulty (Easy ×0.8, Hard ×1.3).</p></div>${achGrid()}</section>
   <section class="card"><div class="eyebrow">Trophy case</div><h2 class="h2">Under your watch</h2>${trophy}</section>
   <section class="card"><div class="eyebrow">Rivalries</div><div class="rivals">${riv}</div></section>

/* ---------- offseason ---------- */

    : `<section class="card"><div class="eyebrow">Board meeting · Board of Regents at ${state.meters.board}</div><h2 class="h2">Present your plan</h2><p class="hint">Approval odds rise with board confidence and a profitable year.</p>

  } else if (step === 2) {

     <div class="tw"><table class="tbl"><thead><tr><th>Player</th><th>Pos</th><th>New class</th><th>OVR</th></tr></thead><tbody>${(o.devlog || []).map(x => { const p = P(x.id); return p ? `<tr><td>${esc(p.n)}</td><td>${p.pos}</td><td>${clsLabel(p)}</td><td>${x.before} → ${ovrTag(x.after)} <span class="up">+${x.after - x.before}</span></td></tr>` : ''; }).join('')}</tbody></table></div></section>
     ${captainsCard()}${walkonCard()}

  return `<section class="card"><ol class="steps">${steps}</ol></section>${step < 5 ? recruitWarn() : ''}${body}`;
}
function teamAwards() {
  const best = f => state.roster.map(p => ({ p, v: f(p.lastSt || {}) })).sort((a, b) => b.v - a.v)[0];
  const off = best(s => (s.py || 0) * 0.05 + (s.ptd || 0) * 4 + (s.ry || 0) * 0.1 + (s.rtd || 0) * 6 + (s.rcy || 0) * 0.1 + (s.rctd || 0) * 6);

    [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((fq, i) => { const o = ac.createOscillator(); const g = ac.createGain(); o.type = 'triangle'; o.frequency.value = fq; const st = t + i * 0.14; g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.18, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + (i === 5 ? 0.55 : 0.13)); o.connect(g).connect(ac.destination); o.start(st); o.stop(st + 0.6); });
  } else if (kind === 'whistle') {
    const o = ac.createOscillator(); const g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(2900, t); const lfo = ac.createOscillator(); const lg = ac.createGain(); lfo.frequency.value = 28; lg.gain.value = 120; lfo.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.1, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45); o.connect(g).connect(ac.destination); o.start(t); lfo.start(t); o.stop(t + 0.5); lfo.stop(t + 0.5);
  }
}

  return `<label class="fld" for="${id}"><span>${label}</span><input id="${id}" type="${type}" data-adm="${target}" data-k="${key}" value="${esc(val)}" ${opts.step ? `step="${opts.step}"` : ''} ${opts.min != null ? `min="${opts.min}"` : ''} ${opts.max != null ? `max="${opts.max}"` : ''}></label>`;
}
function admSet(target, key, el) {
  const raw = el.type === 'checkbox' ? el.checked : el.value;
  const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  const [kind, id] = target.split(':');
  if (kind === 'p') {
    const p = P(id); if (!p) return;
    if (key === 'pos') { if (raw !== p.pos) { state.depth[p.pos] = state.depth[p.pos].filter(x => x !== p.id); p.pos = raw; p.tr = genTraits(raw, p.ovr); state.depth[raw].push(p.id); ui.admPos = raw; ui.admP = p.id; } }
    else if (key.startsWith('tr.')) { const n = num(raw); if (n != null) p.tr[key.slice(3)] = clamp(Math.round(n), 1, 99); }
    else if (['n', 'cls', 'home', 'ht'].includes(key)) p[key] = String(raw).trim() || p[key];

  if (s === 'camp') body = `<h2 class="h3">Summer camps</h2><p>Camps are where recruiting analysts see you in person. A great showing raises your stock; a bad one can hurt it.</p>${o.camp ? `<p class="flash">${esc(o.campTxt || 'Done.')}</p>` : `<div class="evopts">${CAMPS.map(c => `<button class="evopt" data-act="ccamp" data-v="${c.id}"><b>${esc(c.name)}</b><span>${esc(c.desc)}</span></button>`).join('')}</div>`}`;
  if (s === 'train') body = `<h2 class="h3">Offseason training</h2><p>Your body kept developing${o.growXP ? `, and you earned <b>${o.growXP} skill points</b>` : ''}. You have <b>${cs.p.xp}</b> to spend.</p><div class="row gap"><button class="btn" data-act="ctab" data-tab="player">Spend skill points</button>${cs.lvl === 'col' || cs.p.bank > 0 ? '<button class="btn ghost" data-act="ctab" data-tab="nil">Training with NIL money</button>' : ''}</div>`;
  if (s === 'signing') body = `<h2 class="h3">Signing day</h2><p>${cs.rec.committed ? `You're committed to <b>${esc(cTeamName(cs.rec.committed))}</b>. Sign with them, or pick another school that offered.` : 'You haven\'t committed anywhere. Pick a school from your offers.'}</p><button class="btn primary" data-act="ctab" data-tab="recruit">Choose your school</button>`;
  if (s === 'draft') body = draftHTML();

}

   <div class="sline mt">${statLineHTML(st, p.pos)}</div>${starLine}

/* ---------- Stats ---------- */
function seasonTable() {

  const f = cui.recF; let list = all.filter(s => f === 'offers' ? s.off : f === 'int' ? s.i >= 45 || s.off : true);

    const act = signing ? (s.off ? (cui.confirm === 'sign-' + s.id ? `<button class="btn danger sm" data-act="csign" data-id="${s.id}">Confirm: sign here</button>` : `<button class="btn primary sm" data-act="cask2" data-k="sign-${s.id}">Sign</button>`) : '')

    return `<tr class="${com ? 'me' : ''}"><td>${cChip(s.id)}<div class="small muted">${esc(CCONF[t.conf].name)} · ${esc(CSTATES[TEAM_STATE[s.id]])}${px >= 16 ? ' · <span class="pill good">Home state</span>' : px ? ' · <span class="pill ghost">Your region</span>' : ''}</div></td>
     <td data-l="Interest"><div class="ib"><span class="bar"><i class="${s.i >= 70 ? 'good' : s.i >= 45 ? 'warn' : 'bad'}" style="width:${s.i}%"></i></span><span class="num small">${s.i}</span></div></td>
     <td data-l="Offer">${s.off ? `<span class="pill ${com ? 'maize' : 'good'}">${com ? 'Committed' : 'Offered'}</span>` : '<span class="muted small">No offer</span>'}</td><td class="num" data-l="NIL / yr">${s.off ? money(s.nil) : '—'}</td><td class="small dc" data-l="Depth chart">${esc(d.txt)}</td><td class="num vis"${s.v ? ' data-l="Visits"' : ''}>${s.v || ''}</td><td><div class="row gap">${act}${visit}${ask}</div></td></tr>`;
  }).join('');

function heisWatchHTML() {
  if (cs.lvl !== 'col' || !cs.col) return '<p class="muted">You can win the Heisman once you\'re in college. Here are this season\'s front-runners.</p>' + aiHeisList();

}

// Drives go by one at a time until the player's next snap decision (or the final whistle).
function cgRun() {
  clearTimeout(cui.gTimer); if (!cg) return;
  const delay = [0, 420, 170, 0][prefs.liveSpeed] || 0;
  const tick = () => {
    if (!cg || $('#modal').hidden) return;
    let steps = 0;
    do { cgStep(cg); steps++; } while (!delay && !cg.pending && !cg.done && steps < 200);
    if (cg.done && !cui.lastRec) { const g = cg; cui.lastRec = cFinishGame(g); cEndWeek(); cg = g; cSave(); }
    cgView();
    if (!cg.pending && !cg.done) cui.gTimer = setTimeout(tick, delay);
  };
  tick();
}
function openGame() {
  if (!cg) { if (!cStartGame()) return; cui.lastRec = null; cSave(); } // the save marks the game as started, so a reload settles it
  cui.gRes = null; cgView(); cgRun();
}

  cpwait() { const out = portalWait(); if (!out) return; const nOff = out.filter(x => x[0] === 'offer').length, nPull = out.filter(x => x[0] === 'pulled').length; cAfter(`Round ${cs.portal.round}: ${nOff} new offer${nOff === 1 ? '' : 's'}${nPull ? `, ${nPull} withdrawn` : ''}.`); },
  cpcommit(d) { if (portalCommit(d.id)) { cui.confirm = null; cAfter(d.id === cs.portal.from ? `You're going back to ${cTeamName(d.id)}.` : `You're transferring to ${cTeamName(d.id)}.`); } },
  cdraft(d) {
    declareDraft(d.v === 'yes');
    if (cs.phase === 'done') { const r = cs.done.draft; cui.tab = 'home'; cSave(); render(); openModal(`<div class="eyebrow">${r.year} NFL Draft</div><h2 class="h2">${r.udfa ? 'Undrafted' : `Round ${r.round}, pick ${r.pick}`}</h2><p class="big">${r.udfa ? `No team called your name, but the ${esc(r.team)} sign you as a free agent.` : `The <b>${esc(r.team)}</b> select ${esc(cName(cs.p))}.`}</p><p class="muted">Your contract offer and your NFL decision are on the Home tab.</p><div class="row gap mt"><button class="btn primary" data-act="close">Continue</button></div>`, 'NFL Draft'); }
    else cAfter();
  },
  cnfl() { if (nflStart()) { cui.tab = 'home'; cui.confirm = null; cAfter(`Welcome to the NFL. Your rookie season with the ${nflName(cs.nfl.tm)} starts now.`); } },
  cnflskip() { if (nflSkip()) { cui.confirm = null; cAfter('Your career ends at the draft.'); } },
  cretire() { if (nflRetire('choice')) { cui.confirm = null; cui.tab = 'home'; cAfter('You retired.'); window.scrollTo(0, 0); } },
  cfa(d) { const o = cs.nfl.fa && cs.nfl.fa.offers[+d.i]; if (o && nflSign(+d.i)) { cui.confirm = null; cAfter(`You signed with the ${nflName(o.tm)}.`); } },
  cfawait() { const out = nflFAWait(); if (!out) return; const nOff = out.filter(x => x[0] === 'offer').length, nPull = out.filter(x => x[0] === 'pulled').length; cAfter(`A week of free agency: ${nOff} new offer${nOff === 1 ? '' : 's'}${nPull ? `, ${nPull} pulled` : ''}.`); },
  ctrade() { cui.confirm = null; const r = nflRequestTrade(); if (!r) return; cAfter(r.ok ? `You've been traded to the ${nflName(r.to)}.` : 'Your team turned down the trade request. Your coach isn\'t happy.'); },
  cext() { const r = nflAskExtension(); if (!r) return; cAfter(r.ok ? `Extension signed: ${r.yrs} more year${r.yrs > 1 ? 's' : ''} at ${money(r.apy)} a year.` : 'No extension for now. The team wants to see another season.'); },
  cnlg(d) { cui.nlgV = d.v; render(); refocus({ act: 'cnlg', v: d.v }); },
  cup(d) { const k = d.k; const n = upgrade(k, +(d.n || 1)); cSave(); render(); refocus({ act: 'cup', k, ...(d.n ? { n: d.n } : {}) }); if (n) announce(`${CATTR[cs.p.pos].find(a => a[0] === k)[1]} is now ${cs.p.a[k]}.`); },
  cauto() { autoAssign(); cAfter('Skill points spent.'); },
  ctrain(d) { const t = TRAIN.find(x => x.id === d.id); if (buyTraining(d.id)) cAfter(`Done: ${t.name}.`); },
  crs(d) { if (!cs.col) return; cs.col.rs = d.v === 'on'; cAfter(cs.col.rs ? 'Redshirt plan on. You\'ll play four games at most this season.' : 'Redshirt plan off.'); refocus({ act: 'crs', v: d.v }); },
  cpace(d) { if (PACES[d.v]) cs.pace = d.v; cAfter(); refocus({ act: 'cpace', v: d.v }); },
  cdiff(d) { if (CDIFF[d.v]) cs.diff = d.v; cAfter(); refocus({ act: 'cdiff', v: d.v }); },
  csound(d) { cs.sound = d.v === 'on'; if (cs.sound) sfx('crowd'); cAfter(cs.sound ? 'Sound on.' : 'Sound off.'); refocus({ act: 'csound', v: d.v }); },
  cautoset(d) { cs.p.auto = d.v === 'on'; if (cs.p.auto) autoAssign(); cAfter(); refocus({ act: 'cautoset', v: d.v }); },
  crecf(d) { cui.recF = d.v; render(); refocus({ act: 'crecf', v: d.v }); },
  clg(d) { cui.lgV = d.v; render(); refocus({ act: 'clg', v: d.v }); },
  cnew(d) { cui.form = defaultForm(+d.i); cui.confirm = null; render(); const el = document.getElementById('cnewform'); if (el) { el.scrollIntoView({ block: 'start' }); const f = document.getElementById('cf-first'); if (f) f.focus({ preventScroll: true }); } },
  cform(d) { readCForm(); const f = cui.form; if (!f) return; f[d.k] = d.k === 'stars' ? +d.v : d.v; if (d.k === 'pos') f.style = CSTYLES[d.v][0][0]; render(); refocus({ act: 'cform', k: d.k, v: d.v }); },
  ccancel() { cui.form = null; cui.confirm = null; render(); },
  async cstart() {
    readCForm(); const f = cui.form; if (!f) return; cui.confirm = null;
    f.first = String(f.first || '').trim(); f.last = String(f.last || '').trim(); const num = Math.round(+f.num);
    if (!f.first || !f.last) { f.err = 'Give your player a first and last name.'; render(); return; }
    if (!Number.isFinite(num) || num < 0 || num > 99) { f.err = 'Jersey numbers go from 0 to 99.'; render(); return; }
    if (cs && !(await cSaveNow())) { f.err = C_SAVE_FAIL; render(); return; }
    newCareer({ pos: f.pos, style: f.style, first: f.first, last: f.last, num, home: f.home, path: f.path, stars: f.stars, hsName: f.hsName ? String(f.hsName).trim().slice(0, 28) + (/high|academy|prep|school/i.test(f.hsName) ? '' : ' High') : '', diff: f.diff, pace: f.pace });
    cslot = f.slot; lsSet(CACTIVE_KEY, String(cslot)); cui.form = null; cui.tab = 'home'; cg = null; rosterCache.clear();
    cui.flash = f.path === 'college' ? 'Your offers are in. Compare them on the Recruiting tab, then sign.' : 'Welcome to high school football. Play your first game from the top of the page.';
    cSave(); await cFlush(); render(); window.scrollTo(0, 0);
  },
  async cload(d) { const i = +d.i; if (cs && !(await cSaveNow())) { cui.flash = C_SAVE_FAIL; render(); return; } const r = await cLoadSlot(i); if (!r.ok) { cui.flash = r.err; render(); return; } cui.tab = 'home'; cui.form = null; if (cs.settled) { const s = cs.settled; cui.flash = `Your game in ${cWeekLabel(s.wk)} was still going when you left, so it was played to the final.`; cs.settled = null; } else cui.flash = `Loaded ${cName(cs.p)}.`; cSave(); render(); },
  async cretry() { const ok = await cSaveNow(); cui.flash = ok ? 'Saved.' : C_SAVE_FAIL; render(); },
  async ccode() { cui.code = await cMakeCode(); cui.codeMsg = ''; render(); const t = document.getElementById('ccodeout'); if (t) { t.focus(); t.select(); } },
  async ccopy() { const t = document.getElementById('ccodeout'); if (!t) return; let ok = false; try { await navigator.clipboard.writeText(t.value); ok = true; } catch (e) { t.focus(); t.select(); try { ok = document.execCommand('copy'); } catch (e2) { } } announce(ok ? 'Save code copied.' : 'Select the code and copy it.'); cui.codeMsg = ok ? 'Copied.' : 'Select the code above and copy it.'; const m = document.getElementById('ccodemsg'); if (m) m.textContent = cui.codeMsg; },
  async cimport() {
    const box = document.getElementById('cimportbox'); const code = box ? box.value : ''; cui.importCode = code; cui.confirm = null;
    let c; try { c = await cReadCode(code); } catch (e) { cui.importMsg = e.message + ' Your current career was not changed.'; render(); return; }
    if (cs && !(await cSaveNow())) { cui.importMsg = C_SAVE_FAIL; render(); return; }
    const target = cs ? cslot : ([1, 2, 3, 4, 5].find(i => !lsGet(CSLOT_KEY(i))) || 1);
    try { cAdopt(c); } catch (e) { cui.importMsg = 'That save could not be loaded: ' + e.message + ' Your current career was not changed.'; render(); return; }
    cslot = target; lsSet(CACTIVE_KEY, String(target)); cui.importCode = ''; cui.importMsg = ''; cui.code = '';
    cui.flash = `Save code loaded into slot ${target}: ${cName(cs.p)}.`; cui.tab = 'home'; cSave(); render();
  },
  async cdel(d) { const i = +d.i; await cDeleteSlot(i); cui.confirm = null; if (cs && cslot === i) { cs = null; cg = null; } cui.flash = `Slot ${i} deleted.`; render(); },
});
// Career sounds: a crowd roar when the player's snap scores or forces a turnover.
function sfxFor(r) { try { if (cs && cs.sound && r && (r.imm === 'td' && cg && cg.side === 'off' || r.imm === 'to' && cg && cg.side === 'def' || r.pick6)) sfx('crowd'); } catch (e) { console.error(e); } }
// career form fields, sort menus and admin inputs
// the school picker on the home screen
document.addEventListener('change', e => { if (appMode !== 'home' || !cui.adPick) return; if (e.target.id === 'nc-tid') { ui.nc.tid = e.target.value; render(); const el = document.getElementById('nc-tid'); if (el) el.focus(); } });
document.addEventListener('change', e => {
  if (appMode !== 'career') return; const t = e.target;
  if (t.id === 'cautochk') { cs.p.auto = t.checked; if (t.checked) autoAssign(); cSave(); render(); refocus({}); const c = document.getElementById('cautochk'); if (c) c.focus(); return; }
  if (t.id === 'crecsort') { cui.recSort = t.value; render(); const s = document.getElementById('crecsort'); if (s) s.focus(); return; }
  if (t.id === 'cconfsel') { cui.lgConf = t.value; render(); const s = document.getElementById('cconfsel'); if (s) s.focus(); return; }
  if (t.id === 'cadmteam') { cui.admT = t.value; render(); const s = document.getElementById('cadmteam'); if (s) s.focus(); return; }
  if (t.dataset && t.dataset.cadm) { cAdmSet(t.dataset.cadm, t); return; }
  if (t.id && t.id.startsWith('cf-')) { readCForm(); return; }
});
// Hiding the page saves the career only if it's the mode being played; anything already queued
// is written either way. An inactive career is never re-snapshotted (its random position
// belongs to it, not to AD).
function cPageHidden() { if (cs && appMode === 'career') cSave(); if (cq) cFlushSync(); }
window.addEventListener('pagehide', cPageHidden);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') cPageHidden(); });
// Start on the home screen.
function bootHome() { appMode = 'home'; rngOwner = null; render(); const b = document.querySelector('#view [data-act="goad"]'); if (b && !prefs.seen) { } }
bootHome();

</script>
